name: waypoint
services:
  waypoint:
    build: .
    image: waypoint-proxy-manager:local
    restart: unless-stopped
    ports:
      - '${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-81}:3001'
    labels:
      waypoint.discovery: waypoint
    environment:
      NGINX_MODE: external
      NGINX_SHARED_ROOT: /etc/nginx/waypoint
      PROXY_HTTP_PORT: '${HTTP_PORT:-80}'
      PROXY_HTTPS_PORT: '${HTTPS_PORT:-443}'
      PUBLIC_HTTPS_PORT: '${HTTPS_PORT:-443}'
    volumes:
      - discovery:/discovery:ro
      - ./data:/data
    networks:
      - proxy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  waypoint-discovery:
    image: waypoint-proxy-manager:local
    restart: unless-stopped
    command: ['python', '-m', 'server.discovery']
    network_mode: none
    healthcheck:
      disable: true
    environment:
      DISCOVERY_MANAGER_ID: waypoint
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - discovery:/discovery
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  proxy:
    external: true
    name: '${NGINX_NETWORK:-proxy}'

volumes:
  discovery:
