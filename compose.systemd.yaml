name: waypoint-systemd
services:
  waypoint:
    build: .
    image: waypoint-proxy-manager:local
    restart: unless-stopped
    ports:
      - '${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-81}:3001'
    labels:
      waypoint.discovery: waypoint
    environment:
      NGINX_MODE: systemd
      NGINX_CONTROL_SOCKET: /control/nginx.sock
      NGINX_SHARED_ROOT: '${WAYPOINT_DATA_DIR:?Set WAYPOINT_DATA_DIR to the absolute host data directory}'
      NGINX_RESOLVER: '${NGINX_RESOLVER:-127.0.0.53}'
      NGINX_CA_FILE: '${NGINX_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}'
      PROXY_HTTP_PORT: '${HTTP_PORT:-80}'
      PROXY_HTTPS_PORT: '${HTTPS_PORT:-443}'
      PUBLIC_HTTPS_PORT: '${HTTPS_PORT:-443}'
    volumes:
      - /run/waypoint:/control:ro
      - '${WAYPOINT_DATA_DIR}:/data'
      - discovery:/discovery:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  waypoint-discovery:
    image: waypoint-proxy-manager:local
    restart: unless-stopped
    command: ['python', '-m', 'server.discovery']
    network_mode: none
    healthcheck:
      disable: true
    environment:
      DISCOVERY_MANAGER_ID: waypoint
      DISCOVERY_TARGET: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - discovery:/discovery
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  discovery:
